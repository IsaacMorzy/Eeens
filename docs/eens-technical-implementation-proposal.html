<title>Eens Limited — Technical Implementation Proposal</title>
<style>
:root{--ink:#0f172a;--muted:#475569;--line:#94a3b8;--accent:#0e7490;--paper:#fff;--soft:#f1f5f9}*{box-sizing:border-box}html{background:#fafaf9}body{margin:0;color:var(--ink);background:var(--paper);font:10.2pt/1.48 Arial,Helvetica,sans-serif}main{max-width:180mm;margin:auto;padding:18mm 0}h1,h2,h3{line-height:1.14;page-break-after:avoid}h1{font-size:25pt;margin:0 0 12pt}h2{font-size:17pt;margin:23pt 0 8pt;border-bottom:1px solid var(--line);padding-bottom:4pt}h3{font-size:12.5pt;margin:16pt 0 6pt;color:var(--accent)}p{margin:0 0 8pt;orphans:3;widows:3}strong{font-weight:700}code,pre{font-family:"Courier New",monospace}code{font-size:8.5pt;background:var(--soft);padding:1px 3px}pre{white-space:pre-wrap;font-size:7.8pt;line-height:1.35;background:var(--soft);border-left:3px solid var(--accent);padding:9pt 10pt;margin:8pt 0 12pt;page-break-inside:avoid}blockquote{border-left:3px solid var(--accent);margin:10pt 0;padding:3pt 12pt;color:var(--muted);font-size:11pt}ul,ol{margin:4pt 0 9pt 17pt;padding:0}li{margin:2pt 0}hr{border:0;border-top:1px solid var(--line);margin:18pt 0}table{width:100%;border-collapse:collapse;margin:8pt 0 13pt;font-size:8.35pt;page-break-inside:auto}thead{display:table-header-group}tr{page-break-inside:avoid}th{background:var(--ink);color:white;text-align:left}th,td{border:1px solid #cbd5e1;padding:5pt 6pt;vertical-align:top}tr:nth-child(even) td{background:#f8fafc}.cover{min-height:245mm;display:flex;flex-direction:column;justify-content:space-between;page-break-after:always;padding:20mm 14mm 15mm;background:var(--ink);color:white}.cover h1,.cover p{color:white}.cover h1{font-size:33pt;max-width:145mm;margin-top:25mm}.eyebrow{color:#67e8f9;font:9pt "Courier New",monospace;letter-spacing:1.2pt;text-transform:uppercase}.rule{width:35mm;border-top:3px solid #67e8f9;margin:20pt 0}.meta{font:8.5pt/1.8 "Courier New",monospace;color:#cbd5e1}.footer{border-top:1px solid #475569;padding-top:10pt;font-size:8.5pt;color:#cbd5e1}@page{size:A4;margin:18mm 16mm 18mm}@media print{html,body{background:white}main{padding:0}a{color:inherit}}
</style>

<body><main id="document"><p>Loading proposal...</p></main>
<script>
(()=>{const source='eens-technical-implementation-proposal.md';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');const cells=s=>s.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>inline(x.trim()));const sep=s=>/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(s);function render(md){const l=md.replace(/\r\n/g,'\n').split('\n');let o='',i=0,code=false,b='';while(i<l.length){const x=l[i];if(x.startsWith('```')){if(!code){code=true;b=''}else{o+='<pre>'+esc(b.replace(/\n$/,''))+'</pre>';code=false}i++;continue}if(code){b+=x+'\n';i++;continue}if(!x.trim()){i++;continue}if(x==='---'){o+='<hr>';i++;continue}if(/^\|/.test(x)&&i+1<l.length&&sep(l[i+1])){const h=cells(x);i+=2;let r=[];while(i<l.length&&/^\|/.test(l[i])&&l[i].trim()){r.push(cells(l[i++]));}o+='<table><thead><tr>'+h.map(v=>'<th>'+v+'</th>').join('')+'</tr></thead><tbody>'+r.map(a=>'<tr>'+h.map((_,n)=>'<td>'+(a[n]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';continue}const h=x.match(/^(#{1,4})\s+(.*)$/);if(h){o+='<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>';i++;continue}if(/^>\s?/.test(x)){o+='<blockquote>'+inline(x.replace(/^>\s?/,''))+'</blockquote>';i++;continue}if(/^\s*[-*]\s+/.test(x)){o+='<ul>';while(i<l.length&&/^\s*[-*]\s+/.test(l[i]))o+='<li>'+inline(l[i++].replace(/^\s*[-*]\s+/,''))+'</li>';o+='</ul>';continue}if(/^\s*\d+\.\s+/.test(x)){o+='<ol>';while(i<l.length&&/^\s*\d+\.\s+/.test(l[i]))o+='<li>'+inline(l[i++].replace(/^\s*\d+\.\s+/,''))+'</li>';o+='</ol>';continue}let p=[x];i++;while(i<l.length&&l[i].trim()&&!/^#{1,4}\s/.test(l[i])&&l[i]!=='---'&&!/^\s*[-*]\s+/.test(l[i])&&!/^\s*\d+\.\s+/.test(l[i])&&!/^>\s?/.test(l[i])&&!/^\|/.test(l[i])&&!l[i].startsWith('```'))p.push(l[i++]);o+='<p>'+inline(p.join(' '))+'</p>'}return o}fetch(source).then(r=>r.text()).then(md=>{document.getElementById('document').innerHTML='<section class="cover"><div><div class="eyebrow">Eens Limited / NT-PRP-2026-EENS-TECH</div><div class="rule"></div><h1>Technical Implementation Proposal</h1><p>Engineer-facing system contract for property publishing, demand capture, CRM, billing, integrations, AI controls, security, observability, and acceptance.</p></div><div><div class="meta">Prepared by Nimbuz Tech<br>13 August 2026<br>Companion to the executive sales proposal</div><div class="footer">Eens Limited · eensbpark.ke</div></div></section>'+render(md)}).catch(()=>{document.getElementById('document').innerHTML='<p>Unable to load the technical proposal source.</p>'})})();
</script></body></html>
